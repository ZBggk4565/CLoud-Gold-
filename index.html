<head>
 <script src="cloud.js"></script>

<title>Cloud Gold – المدير والمسيّر</title>
<style>
:root{box-sizing:border-box;--bg:#faf7f0;--card:#fff;--tx:#2a2418;--mu:#7a6f5a;--ac:#8a6508;--ac2:#fff;--bd:#e6dcc3;--ok:#2e7d32;--bad:#c62828;--ts:55%;--tl:32%;--th:38;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140e;--card:#221e15;--tx:#f1ead8;--mu:#a89c80;--ac:#e0b440;--ac2:#17140e;--bd:#3a3322;--ok:#7bd17f;--bad:#ff8a80;--tl:74%}}
:root[data-theme="dark"]{--bg:#17140e;--card:#221e15;--tx:#f1ead8;--mu:#a89c80;--ac:#e0b440;--ac2:#17140e;--bd:#3a3322;--ok:#7bd17f;--bad:#ff8a80;--tl:74%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
header{padding:12px 14px;font-weight:700;font-size:18px;color:var(--ac)}
nav{display:flex;overflow-x:auto;gap:6px;padding:0 10px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;font-size:14px}
nav button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
main{padding:10px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font-size:16px;font-weight:700}
.btn.s{width:auto;padding:6px 12px;font-size:14px;margin:0}
.it{border-top:1px solid var(--bd);padding:8px 0;font-size:15px}
.it:first-of-type{border-top:0}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--ac);color:var(--ac2);font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.k b{display:block;font-size:20px;color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:center}th{color:var(--mu);font-size:13px}
.u{font-size:.62em;color:var(--mu);font-weight:400}
.chip{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px;border-radius:20px;font-size:14px}.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.plog{margin-top:8px;border:1px solid var(--bd);border-radius:10px;padding:6px 8px}.plog summary{cursor:pointer;font-weight:700;padding:4px 0}

#v h2{color:hsl(var(--th) var(--ts) var(--tl))}
#v .card{border-top:3px solid hsl(var(--th) 50% 50%)}
.k b:not(.ok):not(.bad){color:hsl(var(--th) var(--ts) var(--tl))}
nav button{border:2px solid hsl(var(--th) 50% 48%);color:hsl(var(--th) var(--ts) var(--tl));font-weight:600}
nav button.on{background:hsl(var(--th) 55% 27%);color:#fff;border-color:hsl(var(--th) 55% 27%)}
.btn[onclick*="add"],.btn[onclick*="save"],.btn[onclick*="set"],.btn[onclick*="doRef"],.btn[onclick*="doneProc"],.btn[onclick*="doSell"],.btn[onclick*="startProc"],.btn[onclick*="payK"],.btn[onclick*="openDone"],.btn[onclick*="dOk"]{background:#2e7d32;color:#fff}
.btn[onclick*="edit"]{background:#1565c0;color:#fff}
.btn[onclick*="srch"]{background:#00796b;color:#fff}
.btn[onclick*="withdraw"]{background:#bf360c;color:#fff}
.btn[onclick*="settleG"],.btn[onclick*="pickSell"],.btn[onclick*="fitSell"],.btn[onclick*="useToday"]{background:#8a6508;color:#fff}
.btn[onclick*="resume"]{background:#6a1b9a;color:#fff}
.btn[onclick*="openRef"]{background:#00695c;color:#fff}
.btn[onclick*="del"],.btn[onclick*="wipe"],.btn[onclick*="voidGP"]{background:#c62828!important;color:#fff!important}
.btn[onclick*="undo"],.btn[onclick*="cancelProc"],.btn[onclick*="closePay"],.btn[onclick*="dClose"]{background:#546e7a;color:#fff}
#v{padding-bottom:96px}
.pulse{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffb300;margin-inline-end:6px;vertical-align:middle;animation:plDot 1.5s ease-in-out infinite}
.tag.glow{animation:plTag 1.5s ease-in-out infinite}
@keyframes plDot{0%,100%{box-shadow:0 0 0 0 rgba(255,179,0,.85);opacity:1}50%{box-shadow:0 0 0 8px rgba(255,179,0,0);opacity:.5}}
@keyframes plTag{0%,100%{box-shadow:0 0 0 0 rgba(255,179,0,.6)}50%{box-shadow:0 0 10px 3px rgba(255,179,0,.55)}}
.pulse.red{background:#e53935;animation-name:plRed}
.tag.glowr{animation:plTagR 1.5s ease-in-out infinite}
@keyframes plRed{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.85);opacity:1}50%{box-shadow:0 0 0 8px rgba(229,57,53,0);opacity:.5}}
@keyframes plTagR{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.6)}50%{box-shadow:0 0 10px 3px rgba(229,57,53,.55)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse.red,.tag.glow,.tag.glowr{animation:none}}
</style>
<meta name="theme-color" content="#8a6508">

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<header id="hd"></header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="pm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;padding:16px;overflow:auto"></div>
<button id="fab" class="btn" onclick="openPay()" style="display:none;position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;padding:12px 18px;z-index:10;border-radius:30px;box-shadow:0 2px 10px rgba(0,0,0,.35)">💰 سداد</button>
<div id="dlg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;padding:16px;overflow:auto"></div>
<div id="toast" style="display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:50;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:700"></div>
<script>
var S={gp:0,company:'',role:null,price:680,water:0,fee:100,cs:[],log:[],ws:[],ex:[],n:0,tab:0};
try{var o=localStorage.getItem('cg1');if(o)S=JSON.parse(o)}catch(e){}
if(!S.bk)S.bk=[];if(!S.mp)S.mp=[];if(!S.gpl)S.gpl=[];if(S.gp>0&&!S.gpl.length)S.gpl.push({p:S.gp,t:'قبل التحديث',ts:0,no:nextNo('y')});S.gp=0;
function save(){try{localStorage.setItem('cg1',JSON.stringify(S))}catch(e){}}
var H=[220,248,28,193,138,332,0,276,165,304,55,83,110,40,215];var T=['1 تسجيل الزبون','2 أدوار الزبناء','3 بدء المعالجة','4 سجل البحث','5 المنتهون','6 العمال','7 المصاريف','8 الخانة العامة','9 المدفوعات','10 دفعات المدير','11 مبيعات الذهب','12 كشف الزبناء','13 رأس مال الشركة','14 الزئبق','📊 نظرة عامة'];
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function N(x){return Number(x||0)}
function M(x){return F(x)+' <small class="u">أوقية جديدة</small>'}
function Mt(x){return F(x)+' أوقية جديدة'}
function F(x){var v=Math.round(N(x)*100)/100,t=v.toLocaleString('en-US');return v<0?'\u2066'+t+'\u2069':t}
function now(){var d=new Date();return d.toLocaleDateString('ar-u-nu-latn')+' '+d.toLocaleTimeString('ar-u-nu-latn',{hour:'2-digit',minute:'2-digit'})}
function today(){return new Date().toISOString().slice(0,10)}
function debt(c){return c.debts.reduce(function(a,d){return a+N(d.a)},0)}
function lots(c){if(!c.cl)c.cl=[{n:N(c.sacks),p:N(c.cp)||N(S.price)}];return c.cl}
function carry(c){return lots(c).reduce(function(x,l){return x+l.n*l.p},0)}
function carryTxt(c){var L=lots(c).filter(function(l){return l.n>0});if(!L.length)return '0';return L.map(function(l){return F(l.n)+' خنش × '+F(l.p)}).join(' + ')}
function setSacks(c,n){n=N(n);lots(c);var tot=c.cl.reduce(function(x,l){return x+l.n},0),d=n-tot;if(d>0)c.cl.push({n:d,p:N(S.price)});else if(d<0){var r=-d;for(var i=c.cl.length-1;i>=0&&r>0;i--){var t=Math.min(c.cl[i].n,r);c.cl[i].n-=t;r-=t}}c.sacks=n}
function intr(c){return N(c.gold)*N(S.fee)}
function carryDue(c){return c.done?carry(c):carryFor(c,N(c.proc))}
function due(c){return debt(c)+carryDue(c)+intr(c)}
function owe(c){var b=bal(c);return b.d+b.h+b.f}
function st(c){var r=owe(c);return r>0?'عليه: <b class="bad">'+M(r)+'</b>':'<b class="ok">✔ مسدّد – عليه 0</b><div class="mu">الباقي حسابه هو: ذهب '+F(c.gold)+' غ</div>'}
function V(id){return document.getElementById(id).value}
function go(i){S.lastReg='';S.tab=i;save();draw()}
function drawNav(){document.getElementById('nav').innerHTML=T.map(function(t,i){return '<button class="'+(i==S.tab?'on':'')+'" style="--th:'+H[i]+'" onclick="go('+i+')">'+t+'</button>'}).join('')}
function opts(list){return list.map(function(c){return '<option value="'+c.id+'">'+E(c.name)+' (#'+c.id+')</option>'}).join('')}
function find(id){return S.cs.filter(function(c){return c.id==id})[0]}
function addCust(){var n=V('n').trim();if(!n)return toast('اكتب اسم الزبون');
 var p=V('pr');if(p!=='')S.price=N(p);
 S.n++;S.cs.push({id:S.n,name:n,phone:V('ph'),arrival:V('ar')||today(),no:nextNo('z'),ts:Date.now(),sacks:N(V('sk')),cl:[{n:N(V('sk')),p:S.price}],done:0,proc:0,gold:0,debts:[],paid:0});S.lastReg='✅ تم تسجيل '+n+' – رقم المعاملة '+cno(S.cs[S.cs.length-1])+' – دوره رقم '+qlist().length+' في القائمة';save();toast('✅ تم تسجيل '+n,1);draw()}
function editC(id){var c=find(id);if(chk(c))return;var m=document.getElementById('pm');m.innerHTML='<div class="card"><h2>✏️ تعديل بيانات الزبون</h2><label>الاسم</label><input id="en1" value="'+E(c.name)+'"><label>رقم الهاتف</label><input id="ep1" value="'+E(c.phone)+'"><div class="row"><div><label>عدد الخنشات</label><input id="es1" type="number" value="'+c.sacks+'"></div><div><label>خنشات معالجة</label><input id="ec1" type="number" value="'+c.proc+'"></div></div><label>الذهب (غرام)</label><input id="eg1" type="number" step="0.01" value="'+c.gold+'"><label>تاريخ الوصول</label><input id="ed1" type="date" value="'+E(c.arrival)+'"><button class="btn" onclick="saveC('+id+')">حفظ التعديل</button><button class="btn" style="background:var(--bd);color:var(--tx)" onclick="closePay()">إلغاء</button></div>';m.style.display='block'}
function saveC(id){var c=find(id),n=V('en1').trim();if(chk(c))return;if(!n)return toast('اكتب الاسم');c.name=n;c.phone=V('ep1');setSacks(c,V('es1'));c.proc=N(V('ec1'));c.gold=N(V('eg1'));c.arrival=V('ed1')||c.arrival;c.ed=now();save();closePay();draw()}
function editD(id,j){var c=find(id);if(chk(c))return;askIn('المبلغ الصحيح للدين:',c.debts[j].a,function(a){c.debts[j].a=N(a);c.debts[j].ed=now();save();draw()})}
function delD(id,j){var c=find(id);if(chk(c))return;ask('حذف هذا الدين؟',function(){c.debts.splice(j,1);save();draw()})}
function lk(c){return c.done&&owe(c)<=0&&N(c.paid)>0&&N(c.proc)-rf(c)<=0.0001&&remG(c)<=0.0001}
function chk(c){if(lk(c)){toast('🔒 حساب هذا الزبون مغلق: انتهت معالجته وسدد كل ما عليه، فلا يمكن تعديله');return true}return false}

function remG(c){return legacy(c)?0:Math.max(0,N(c.gold)-sv(c).g)}
function sg(c){return legacy(c)?N(c.gold):sv(c).g}
function svv(c){return legacy(c)?N(c.gold)*gpr(c):sv(c).v}
function gval(c){return legacy(c)?N(c.gold)*gpr(c):sv(c).v+(sv(c).g>0?0:remG(c)*gpr(c))}
function cashAvail(c){return Math.max(0,svv(c)-gtaken(c)-wdn(c))}
function acc(){var p=0,h=0;S.cs.forEach(function(c){p+=N(c.paid);h+=hold(c)});return {pd:p,h:h,t:p+h}}
function applySale(c,g,p,d,pref,kt){if(!c.sales)c.sales=[];var sno=nextNo('b');c.sales.push({g:g,p:p,t:now(),ts:Date.now(),no:sno,cid:c.id,pref:pref||'',k:kt||''});c.gp=p;var b=bal(c);d=d||{d:b.d,h:b.h,f:b.f};var tot=0;if(!c.pays)c.pays=[];[['دين',d.d],['حمل',d.h],['فائدة',d.f]].forEach(function(y){var x=N(y[1]);if(x>0){c.pays.push({k:y[0],a:x,t:now(),g:1,no:sno,ts:Date.now()});tot+=x}});c.sold=c.sold||now();c.paid=N(c.paid)+tot}
function simSell(id,g,p){var snap=JSON.stringify(S);applySale(find(id),g,p);var r=acc();S=JSON.parse(snap);return r}
function gtaken(c){return (c.pays||[]).filter(function(p){return p.g}).reduce(function(x,p){return x+p.a},0)}
function wdn(c){return (c.wds||[]).reduce(function(x,w){return x+w.a},0)}
function tbl(l){if(!l.length)return '<div class="mu">لا مبيعات بعد</div>';return '<table><tr><th>الزبون</th><th>الغرامات</th><th>سعر الغرام</th><th>مجموع البيع</th></tr>'+l.map(function(c){return '<tr><td>'+E(c.name)+'</td><td>'+F(sg(c))+'</td><td>'+F(sg(c)?svv(c)/sg(c):gpr(c))+'</td><td><b>'+F(svv(c))+'</b></td></tr>'}).join('')+'<tr><td><b>المجموع</b></td><td><b>'+F(l.reduce(function(x,c){return x+sg(c)},0))+'</b></td><td></td><td><b>'+F(l.reduce(function(x,c){return x+svv(c)},0))+'</b></td></tr></table><div class="mu">المبالغ بالأوقية الجديدة</div>'}
function hold(c){return (c.done||c.sold)&&gpr(c)?Math.max(0,gval(c)-gtaken(c)-wdn(c)):0}
function audit(){var is=[];S.cs.forEach(function(c){var s=(c.pays||[]).reduce(function(x,p){return x+p.a},0);if(Math.abs(s-N(c.paid))>0.01)is.push(c.name+': مجموع الدفعات لا يطابق المدفوع');if(N(c.proc)+(c.cur&&!c.done?N(c.cur.n):0)>N(c.sacks)+0.0001)is.push(c.name+': الخنشات المعالجة وقيد المعالجة أكبر من إجمالي خنشاته');if(sg(c)>N(c.gold)+0.001)is.push(c.name+': المباع أكبر من الذهب المصفّى');if(rf(c)>N(c.proc)+0.001)is.push(c.name+': الخنشات المصفّاة أكبر من المكتملة');if((c.refs||[]).length&&Math.abs(c.refs.reduce(function(x,r){return x+r.g},0)-N(c.gold))>0.001)is.push(c.name+': الذهب لا يطابق مجموع التصفيات');if(c.done){var ex=due(c)-N(c.paid);if(Math.abs(ex-owe(c))>0.01)is.push(c.name+': اختلاف '+M(ex-owe(c))+' بين (المستحق − المدفوع) والمتبقي')}if(c.done&&gval(c)-gtaken(c)-wdn(c)<-0.01)is.push(c.name+': السحب أكبر من الأمانة')});return '<div class="card"><h2>🔍 تدقيق الحسابات</h2>'+(is.length?is.map(function(x){return '<div class="it bad">⚠ '+E(x)+'</div>'}).join(''):'<div class="ok"><b>✔ الحسابات متطابقة 100%</b></div>')+'</div>'}
function selCard(){var q=S.cs.filter(function(c){return c.done&&remG(c)>0});return '<div class="card"><h2>💎 اختر زبونًا لبيع ذهبه</h2>'+(q.map(function(c){return '<div class="it"><b>'+E(c.name)+'</b> <span class="mu">'+F(remG(c))+' غ لم يُبع'+(gpr(c)&&!sv(c).g?' – '+M(remG(c)*gpr(c)):' – بلا سعر حتى البيع')+'</span> <button class="btn s" onclick="pickSell('+c.id+')">اختيار للبيع</button></div>'}).join('')||'<div class="mu">لا يوجد زبون جاهز للبيع (يجب إنهاء معالجته أولًا)</div>')+'</div>'}
function pickSell(id){window._gpref='';var c=find(id);if(!c)return;if(remG(c)<=0)return toast(N(c.gold)>0?'بِيع كل الذهب المصفّى لهذا الزبون':'لا ذهب مصفّى جاهز للبيع – أضف تصفية أولًا');var b=bal(c),r2=function(x){return Math.round(x*100)/100},m=document.getElementById('pm');m.innerHTML='<div class="card"><h2>تأكيد بيع ذهب '+E(c.name)+'</h2><div class="mu">ذهبه: '+F(c.gold)+' غ | مباع: '+F(sv(c).g)+' غ | لم يُبع: '+F(remG(c))+' غ</div><div class="row"><div><label>الغرامات المباعة</label><input id="sg" type="number" step="0.01" inputmode="decimal" value="'+r2(remG(c))+'" oninput="sellPrev('+id+')"></div><div><label>سعر الغرام – أوقية جديدة</label><input id="sp" type="number" inputmode="decimal" value="'+(sv(c).g>0?'':(gpr(c)||''))+'" oninput="sellPrev('+id+')"><button class="btn s" style="margin-top:6px" onclick="useToday('+id+')">📈 استخدم سعر اليوم ('+(curGP()?F(curGP().p):'غير مسجَّل')+')</button></div></div><label>العيار (اختياري)</label><input id="sky" type="number" step="0.5" inputmode="decimal" placeholder="مثال: 21"><div class="row"><div><label>تكلفة الحمل المستحقة الآن ('+carryTxt(c)+')</label><input id="dh" type="number" inputmode="decimal" value="'+r2(carryNow(c))+'" oninput="sellPrev('+id+')"></div><div><label>الفائدة</label><input id="df" type="number" inputmode="decimal" value="'+r2(b.f)+'" oninput="sellPrev('+id+')"></div></div><label>الدين المسجَّل (إن وجد)</label><input id="dd" type="number" inputmode="decimal" value="'+r2(b.d)+'" oninput="sellPrev('+id+')"><button class="btn s" style="margin-top:6px" onclick="fitSell('+id+')">⚖️ خصم حسب مبلغ البيع</button><div id="spv"></div><button class="btn" onclick="doSell('+id+')">✅ تأكيد البيع</button><button class="btn" style="background:var(--bd);color:var(--tx)" onclick="closePay()">إلغاء</button></div>';m.style.display='block';sellPrev(id)}
function sellPrev(id){var c=find(id),b=bal(c),g=Math.min(N(V('sg')),remG(c)),p=N(V('sp')),v=g*p,dh=N(V('dh')),df=N(V('df')),dd=N(V('dd')),tot=dh+df+dd,avail=cashAvail(c)+v,left=avail-tot,rem=Math.max(0,remG(c)-g);document.getElementById('spv').innerHTML=lrow('مجموع بيع الذهب ('+F(g)+' غ × '+F(p)+')',M(v))+lrow('− تكلفة الحمل',M(dh))+lrow('− الفائدة',M(df))+lrow('− الدين',M(dd))+lrow('<b>= الباقي أمانة له (نقدًا)</b>','<b class="'+(left<0?'bad':'ok')+'">'+M(left)+'</b>')+lrow('ذهب لم يُبع، باقٍ عند الشركة','<b>'+F(rem)+' غ</b>')+(dh>b.h+0.01||df>b.f+0.01||dd>b.d+0.01?'<div class="bad mu">⚠ أحد الخصومات أكبر من المتبقي عليه (حمل '+F(b.h)+' | فائدة '+F(b.f)+' | دين '+F(b.d)+')</div>':'')+(left<0?'<div class="bad mu">⚠ الخصومات أكبر من حصيلة البيع</div>':'')}
function doSell(id){var c=find(id),b=bal(c),g=N(V('sg')),p=N(V('sp')),dh=N(V('dh')),df=N(V('df')),dd=N(V('dd'));if(!c)return;if(g<=0)return toast('اكتب عدد الغرامات المباعة');if(g>remG(c)+0.0001)return toast('الغرامات المباعة أكبر من الباقي ('+F(remG(c))+' غ)');var kt=N(V('sky'));if(kt<0||kt>24)return toast('العيار يجب أن يكون بين 1 و24');if(p<=0)return toast('اكتب سعر الغرام');if(dh<0||df<0||dd<0)return toast('لا يمكن أن يكون الخصم سالبًا');if(dh>b.h+0.01||df>b.f+0.01||dd>b.d+0.01)return toast('أحد الخصومات أكبر من المتبقي عليه');if(dh+df+dd>cashAvail(c)+g*p+0.01)return toast('الخصومات أكبر من حصيلة البيع');var pref='';if(window._gpref){var ge=(S.gpl||[]).filter(function(e){return e.no==window._gpref})[0];if(ge&&ge.p==p)pref=ge.no}window._gpref='';applySale(c,g,p,{h:dh,f:df,d:dd},pref,kt>0?kt:'');save();closePay();draw()}
function setFlt(v){S.flt=v;save();draw()}
function refPrev(){var c=find(V('c')),r=document.getElementById('rp');if(!c||!r)return;var g=N(c.gold)+N(V('g')),p=N(V('gq'))||gpr(c);r.innerHTML=(p?'<div style="border:1px solid var(--ac);border-radius:10px;padding:8px;margin-top:8px"><b>💎 رصيد ذهب '+E(c.name)+'</b>'+lrow(F(g)+' غ × '+F(p),'<b>'+M(g*p)+'</b>')+'</div>':'<div class="mu">اكتب سعر الغرام لحساب رصيد الذهب</div>')+'<div style="border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:8px"><b>🚚 تكلفة الحمل</b>'+lrow(carryTxt(c),'<b>'+M(carry(c))+'</b>')+'</div>'}
function wipeCust(){ask('سيُحذف كل الزبناء وأرقام هواتفهم وذهبهم ومبيعاتهم ودفعاتهم وسجل البحث. لا يمكن التراجع. متابعة؟',function(){askIn('للتأكيد اكتب كلمة: حذف','',function(t){if(String(t).trim()!=='حذف')return toast('لم يُحذف شيء');S.cs=[];S.log=[];S.hg=[];S.n=0;S.opc={};save();draw();toast('تم حذف بيانات الزبناء والذهب',1)},'text')})}
var dcb=null;
function dClose(){document.getElementById('dlg').style.display='none';dcb=null}
function dOk(){var f=dcb;dClose();if(f)f()}
function dOkv(){var f=dcb,v=V('dv');dClose();if(f)f(v)}
function ask(msg,yes){dcb=yes;var d=document.getElementById('dlg');d.innerHTML='<div class="card" style="margin-top:20vh"><div style="white-space:pre-line;margin-bottom:8px">'+E(msg)+'</div><button class="btn" onclick="dOk()">تأكيد</button><button class="btn" style="background:var(--bd);color:var(--tx)" onclick="dClose()">إلغاء</button></div>';d.style.display='block'}
function askIn(msg,def,cb,typ){dcb=cb;var d=document.getElementById('dlg');d.innerHTML='<div class="card" style="margin-top:20vh"><div style="margin-bottom:8px">'+E(msg)+'</div><input id="dv" type="'+(typ||'number')+'" inputmode="'+(typ=='text'?'text':'decimal')+'" step="any" value="'+E(def==null?'':def)+'"><button class="btn" onclick="dOkv()">موافق</button><button class="btn" style="background:var(--bd);color:var(--tx)" onclick="dClose()">إلغاء</button></div>';d.style.display='block'}
function toast(m,ok){var t=document.getElementById('toast');t.textContent=m;t.style.background=ok?'#2e7d32':'#c62828';t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.display='none'},4000)}
function rmn(c){return Math.max(0,N(c.sacks)-N(c.proc))}
function wait(c){return c.done?0:Math.max(0,rmn(c)-(c.cur?N(c.cur.n):0))}
function qlist(){return S.cs.filter(function(c){return !c.done}).sort(function(x,y){return String(x.qdate||x.arrival||'').localeCompare(String(y.qdate||y.arrival||''))||x.id-y.id})}
function setPrices(){S.price=N(V('pr2'));S.fee=N(V('fe'));save();toast('✅ تم حفظ الأسعار',1);draw()}
function setAllSn(id){document.getElementById('sn'+id).value=Math.round(rmn(find(id))*100)/100}
function startProc(id){var c=find(id),n=N(V('sn'+id));if(!c)return;if(n<=0)return toast('اكتب عدد الخنشات');if(n>rmn(c)+0.0001)return toast('العدد أكبر من الباقي ('+F(rmn(c))+' خنش)');var q=N(V('hq'+id));if(q<0)return toast('كمية الزئبق غير صحيحة');if(q>0&&q>hgStock()+0.0001)return toast('الزئبق المطلوب ('+F(q)+' غ) أكبر من المتوفر ('+F(hgStock())+' غ) – أضف للمخزون في الخانة 14');c.cur={n:n,t:now()};if(q>0){S.hg=S.hg||[];var hno=nextNo('h');S.hg.unshift({no:hno,cid:c.id,name:c.name,n:n,q:q,t:now(),day:today(),ts:Date.now(),auto:1});c.cur.hno=hno}save();toast('🔄 قيد المعالجة: '+c.name+' – '+F(n)+' خنش',1);draw()}
function cancelProc(id){var c=find(id);if(!c)return;ask('إلغاء بدء المعالجة؟'+(c.cur&&c.cur.hno?' سيرجع زئبق هذه الطحنة إلى المخزون.':''),function(){if(c.cur&&c.cur.hno)S.hg=(S.hg||[]).filter(function(x){return x.no!=c.cur.hno});c.cur=null;save();draw()})}
function finishAsk(id){var c=find(id);ask('إنهاء حساب '+c.name+' رغم بقاء '+F(rmn(c))+' خنش غير معالجة؟',function(){finish(id)})}
function openDone(id){var c=find(id),m=document.getElementById('pm');m.innerHTML='<div class="card"><h2>✔ تمت معالجة – '+E(c.name)+'</h2><div class="mu">بدأت: '+F(c.cur.n)+' خنش</div><label>عدد الخنشات التي عولجت فعلًا</label><input id="pn" type="number" inputmode="decimal" value="'+c.cur.n+'"><div class="mu">الذهب يُسجَّل لاحقًا في خانة «المنتهون» عند التصفية.</div><label>دين أخذه الزبون الآن – أوقية جديدة (اختياري)</label><input id="pd" type="number" inputmode="decimal"><div id="fp"></div><button class="btn" onclick="doneProc('+id+')">✅ تأكيد: تمت المعالجة</button><button class="btn" style="background:var(--bd);color:var(--tx)" onclick="closePay()">إلغاء</button></div>';m.style.display='block';finPrev(id)}
function finPrev(id){var c=find(id);document.getElementById('fp').innerHTML=lrow('🚚 تكلفة الحمل ('+carryTxt(c)+')','<b>'+M(carry(c))+'</b>')}
function doneProc(id){var c=find(id),n=N(V('pn')),g=0,q=0,d=N(V('pd'));if(!c)return;if(n<=0)return toast('اكتب عدد الخنشات المعالجة');if(n>rmn(c)+0.0001)return toast('العدد أكبر من الباقي ('+F(rmn(c))+' خنش)');if(g<0||d<0)return toast('لا يمكن أن تكون القيمة سالبة');(c.runs=c.runs||[]).push({no:nextNo('g'),n:n,t:now(),ts:Date.now(),st:c.cur?c.cur.t:''});c.proc=N(c.proc)+n;c.gold=N(c.gold)+g;if(q>0)c.gp=q;if(d>0)c.debts.push({a:d,t:now(),no:nextNo('d'),ts:Date.now()});var he=c.cur&&c.cur.hno?(S.hg||[]).filter(function(x){return x.no==c.cur.hno})[0]:null;if(he)he.n=n;c.cur=null;var fin=rmn(c)<=0.0001;if(fin){c.done=1;c.endAt=now()}save();closePay();toast('✔ تمت معالجة '+F(n)+' خنش'+(fin?' – انتهت معالجة '+c.name+' وانتقل إلى «المنتهون»':' – بقي له '+F(rmn(c))+' خنش ويحتفظ بدوره'),1);draw()}
function rf(c){return (c.refs||[]).reduce(function(x,r){return x+r.n},0)}
function rfBox(c){var left=Math.max(0,N(c.proc)-rf(c));return '<div style="border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0"><b>⚗️ التصفية</b>'+lrow('خنشات تمت تصفيتها',F(rf(c))+' من '+F(c.proc))+lrow('الذهب الخارج','<b>'+F(c.gold)+' غ</b>')+(c.refs||[]).map(function(r,i){return '<div class="mu">'+F(r.n)+' خنش → '+F(r.g)+' غ'+(r.no?' ('+r.no+')':'')+' – '+r.t+' <button class="btn s" onclick="editRef('+c.id+','+i+')">✏️</button> <button class="btn s" onclick="delRef('+c.id+','+i+')">🗑</button></div>'}).join('')+(left>0?'<button class="btn s" onclick="openRef('+c.id+')">⚗️ إضافة تصفية</button> <span class="mu">باقٍ للتصفية: '+F(left)+' خنش</span>':'<div class="ok"><b>✔ تمت تصفية كل الخنشات</b></div>')+'</div>'}
function openRef(id){var c=find(id);if(!c)return;if(chk(c))return;var left=Math.max(0,N(c.proc)-rf(c));if(left<=0)return toast('تمت تصفية كل خنشات هذا الزبون');var m=document.getElementById('pm');m.innerHTML='<div class="card"><h2>⚗️ تصفية – '+E(c.name)+'</h2><div class="mu">خنشات تمت تصفيتها: '+F(rf(c))+' من '+F(c.proc)+'</div><label>عدد الخنشات التي تمت تصفيتها</label><input id="rn" type="number" inputmode="decimal" value="'+(Math.round(left*100)/100)+'"><label>الذهب الخارج (غرام)</label><input id="rg" type="number" step="0.01" inputmode="decimal" oninput="refPrv('+id+')"><div class="mu">💡 سعر الغرام لا يُكتب هنا. يُكتب عند البيع في نافذة «تأكيد البيع»، ولا قيمة مالية للذهب قبل بيعه.</div><div id="rv"></div><button class="btn" onclick="doRef('+id+')">✅ تأكيد التصفية</button><button class="btn" style="background:var(--bd);color:var(--tx)" onclick="closePay()">إلغاء</button></div>';m.style.display='block';refPrv(id)}
function refPrv(id){var c=find(id),g=N(c.gold)+N(V('rg'));document.getElementById('rv').innerHTML=lrow('⚗️ مجموع الذهب المصفّى (بعد هذه التصفية)','<b>'+F(g)+' غ</b>')+lrow('💰 فائدة الشركة ('+F(g)+' غ × '+F(S.fee)+')','<b>'+M(g*S.fee)+'</b>')+lrow('🚚 حمل الخنشات المكتملة ('+F(c.proc)+' خنش)','<b>'+M(carryDue(c))+'</b>')}
function doRef(id){var c=find(id),n=N(V('rn')),g=N(V('rg'));if(!c)return;if(chk(c))return;var left=Math.max(0,N(c.proc)-rf(c));if(n<=0)return toast('اكتب عدد الخنشات');if(n>left+0.0001)return toast('العدد أكبر من الباقي للتصفية ('+F(left)+' خنش)');if(g<=0)return toast('اكتب الذهب الخارج بالغرام');if(!c.refs)c.refs=[];c.refs.push({n:n,g:g,t:now(),ts:Date.now(),no:nextNo('r'),cid:c.id});c.gold=N(c.gold)+g;save();closePay();toast('⚗️ تمت تصفية '+F(n)+' خنش وأخرجت '+F(g)+' غرام',1);draw()}
function editRef(id,i){var c=find(id);if(chk(c))return;askIn('الذهب الخارج الصحيح (غرام):',c.refs[i].g,function(v){var g=N(v);if(g<=0)return toast('اكتب قيمة صحيحة');if(N(c.gold)-c.refs[i].g+g<sg(c)-0.0001)return toast('لا يمكن: الذهب أقل من الغرامات المباعة');c.gold=N(c.gold)-c.refs[i].g+g;c.refs[i].g=g;c.refs[i].ed=now();save();draw()},'number')}
function delRef(id,i){var c=find(id);if(chk(c))return;ask('حذف هذه التصفية؟ سيُنقص ذهبها من رصيد الزبون.',function(){if(N(c.gold)-c.refs[i].g<sg(c)-0.0001)return toast('لا يمكن الحذف: الذهب أقل من الغرامات المباعة');c.gold=Math.max(0,N(c.gold)-c.refs[i].g);c.refs.splice(i,1);save();draw()})}
function paybtns(c){return '<button class="btn s" onclick="payK('+c.id+',\'دين\')">سداد دين</button> <button class="btn s" onclick="payK('+c.id+',\'حمل\')">سداد حمل</button> <button class="btn s" onclick="payK('+c.id+',\'فائدة\')">سداد فائدة</button>'}

function debtBox(c){var b=bal(c);return '<div style="border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0"><b>🧾 ديون الزبون</b>'+(c.debts.map(function(d,j){return '<div class="mu">'+(d.no?'<b>'+d.no+'</b> ':'')+M(d.a)+' – '+d.t+eds(d)+' <button class="btn s" onclick="editD('+c.id+','+j+')">✏️</button> <button class="btn s" onclick="delD('+c.id+','+j+')">🗑</button></div>'}).join('')||'<div class="mu">لا ديون مسجلة</div>')+lrow('إجمالي الديون',M(debt(c)))+lrow('مسدَّد منها',M(ps(c,'دين')))+lrow('<b>المتبقي</b>','<b class="bad">'+M(b.d)+'</b>')+'<button class="btn s" onclick="addDebt('+c.id+')">➕ إضافة دين</button>'+((b.d+b.h+b.f>0&&cashAvail(c)>0)?' <button class="btn s" onclick="deductHold('+c.id+')">💎 خصم من الأمانة</button>':'')+'</div>'}

function nextNo(k){S.opc=S.opc||{};S.opc[k]=(S.opc[k]||0)+1;var P={z:'ز',g:'ط',r:'ت',b:'ب',d:'د',p:'س',w:'ح',e:'ص',k:'ع',m:'م',q:'ق',u:'ر',y:'غ',h:'ئ'};if(k=='z')return 'Gui'+String(S.opc[k]).padStart(5,'0');S.opg=(S.opg||0)+1;var d=new Date(),ym=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0');return (P[k]||'ع')+'-'+ym+'-'+String(S.opg).padStart(5,'0')}

function fitSell(id){var c=find(id),b=bal(c),g=Math.min(N(V('sg')),remG(c)),p=N(V('sp')),pr=cashAvail(c)+g*p,dd=Math.min(b.d,pr),rest=pr-dd,dh=Math.min(carryNow(c),rest);rest-=dh;var df=Math.min(b.f,g*N(S.fee),rest),r2=function(x){return Math.round(x*100)/100};document.getElementById('dd').value=r2(dd);document.getElementById('dh').value=r2(dh);document.getElementById('df').value=r2(df);sellPrev(id)}

function partCard(){var L=S.cs.filter(function(c){return !c.done&&(N(c.proc)>0||N(c.gold)>0||c.sold)});return '<div class="card" style="border-color:var(--ac)"><h2>📦 معالجة جزئية – ذهب جاهز للتصفية والبيع ('+L.length+')</h2><div class="mu">زبناء اكتملت معالجة بعض خنشاتهم وبقية خنشاتهم قيد المعالجة. لا يُعتبر طلبهم منتهيًا حتى تكتمل كل الخنشات.</div></div>'+(L.map(function(c){return '<div class="card"><b>'+E(c.name)+'</b> '+dtag(c)+'<span class="mu">'+E(c.phone)+'</span>'+progLine(c)+rcpt(c)+carryBox(c)+rfBox(c)+gbox(c)+debtBox(c)+'<div class="mu">💳 التسديد والسحب:</div>'+paybtns(c)+'</div>'}).join('')||'<div class="card mu">لا يوجد زبون بمعالجة جزئية</div>')}
function sumGold(){var comp=0,left=0,ref=0,gold=0,sold=0,ready=0;S.cs.forEach(function(c){comp+=N(c.proc);if(!c.done)left+=rmn(c);ref+=rf(c);gold+=N(c.gold);sold+=sg(c);ready+=remG(c)});return lrow('عدد الخنشات المكتملة',F(comp)+' خنش')+lrow('الخنشات المتبقية قيد المعالجة',F(left)+' خنش')+lrow('خنشات تمت تصفيتها',F(ref)+' خنش')+lrow('الذهب الصافي المصفّى',F(gold)+' غ')+lrow('الذهب المباع',F(sold)+' غ')+lrow('<b>الذهب المتبقي غير المباع</b>','<b>'+F(ready)+' غ</b>')}
function opsCards(){var A=[],B=[];S.cs.forEach(function(c){if(legacy(c))A.push({no:'—',t:c.sold,n:c.name,g:N(c.gold),p:gpr(c),a:svv(c)});else (c.sales||[]).forEach(function(x){A.push({no:x.no||'—',t:x.t,n:c.name,g:x.g,p:x.p,a:x.g*x.p,pref:x.pref,k:x.k})});(c.refs||[]).forEach(function(x){B.push({no:x.no||'—',t:x.t,n:c.name,s:x.n,g:x.g})})});return '<div class="card"><h2>📑 سجل عمليات البيع ('+A.length+')</h2>'+(A.map(function(x){return '<div class="it"><b>'+x.no+'</b> – '+E(x.n)+' <span class="mu">'+x.t+'</span><div class="mu">'+F(x.g)+' غ × '+F(x.p)+' = <b>'+M(x.a)+'</b>'+(x.k?' <span class="tag">عيار '+F(x.k)+'</span>':'')+(x.pref?' <span class="tag">📈 '+x.pref+'</span>':'')+'</div></div>'}).join('')||'<div class="mu">لا عمليات بيع بعد</div>')+'</div><div class="card"><h2>⚗️ سجل عمليات التصفية ('+B.length+')</h2>'+(B.map(function(x){return '<div class="it"><b>'+x.no+'</b> – '+E(x.n)+' <span class="mu">'+x.t+'</span><div class="mu">'+F(x.s)+' خنش → <b>'+F(x.g)+' غ</b></div></div>'}).join('')||'<div class="mu">لا عمليات تصفية بعد</div>')+'</div>'}
function cno(c){var n=c.no||('ز-'+String(c.id).padStart(4,'0'));if(/^ز-\d+$/.test(n))return 'Gui'+String(N(n.slice(2))).padStart(5,'0');return n}
function carryBox(c){var b=bal(c),def=carry(c)-carryDue(c);return '<div style="border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0"><b>🚚 حساب الحمل</b>'+lrow('إجمالي الحمل المسجَّل ('+carryTxt(c)+')',M(carry(c)))+lrow('مستحق الآن ('+F(c.done?c.sacks:c.proc)+' خنش '+(c.done?'':'مكتملة')+')',M(carryDue(c)))+(def>0.001?lrow('🚚 مؤجَّل (خنشات قيد المعالجة – غير مستحق بعد)',M(def)):'')+lrow('مسدَّد منه',M(ps(c,'حمل')))+lrow('<b>المتبقي المستحق عليه الآن</b>','<b class="'+(b.h>0?'bad':'ok')+'">'+M(b.h)+'</b>')+'<div class="mu">الشركة تدفع الحمل أولًا وتسترده بعد البيع. عند كل بيع يُخصم حمل الخنشات المكتملة فقط، ولا يُخصم حمل خنشة مرتين.</div></div>'}
function custLog(c){var L=[];L.push({no:cno(c),ts:c.ts||0,t:c.arrival,x:'تسجيل الزبون – '+F(c.sacks)+' خنش'});(c.runs||[]).forEach(function(r){L.push({no:r.no,ts:r.ts||0,t:r.t,x:'معالجة '+F(r.n)+' خنش'})});(c.returns||[]).forEach(function(r){L.push({no:r.no||'—',ts:r.ts||0,t:r.t,x:'عودة الزبون'})});(c.refs||[]).forEach(function(r){L.push({no:r.no||'—',ts:r.ts||0,t:r.t,x:'تصفية '+F(r.n)+' خنش → '+F(r.g)+' غ'})});(c.sales||[]).forEach(function(r){L.push({no:r.no||'—',ts:r.ts||0,t:r.t,x:'بيع '+F(r.g)+' غ × '+F(r.p)+' = '+M(r.g*r.p)+(r.k?' – عيار '+F(r.k):'')+(r.pref?' (سعر مرجعي '+r.pref+')':'')})});c.debts.forEach(function(r){L.push({no:r.no||'—',ts:r.ts||0,t:r.t,x:'دين '+M(r.a)})});var G={};(c.pays||[]).forEach(function(p){var k=p.no||('x'+Math.random());if(!G[k])G[k]={no:p.no||'—',ts:p.ts||0,t:p.t,a:0,ks:[],g:!!p.g,m:p.m};G[k].a+=p.a;if(G[k].ks.indexOf(p.k)<0)G[k].ks.push(p.k)});Object.keys(G).forEach(function(k){var g=G[k];L.push({no:g.no,ts:g.ts,t:g.t,x:'تسديد '+g.ks.join(' + ')+' '+M(g.a)+(g.g?' (من الذهب)':' ('+(g.m||'نقدًا')+')')})});(c.wds||[]).forEach(function(r){L.push({no:r.no||'—',ts:r.ts||0,t:r.t,x:'سحب '+M(r.a)+(r.m?' ('+r.m+')':'')})});L.sort(function(a,b){return a.ts-b.ts});return '<details class="plog"><summary>📜 سجل عمليات الزبون ('+L.length+')</summary>'+L.map(function(x){return '<div class="it"><b>'+x.no+'</b> <span class="mu">'+x.t+'</span><div class="mu">'+x.x+'</div></div>'}).join('')+'</details>'}
function stamp(ts){if(!ts)return 'قبل التحديث';var d=new Date(ts);return d.toLocaleDateString('ar-u-nu-latn')+' '+d.toLocaleTimeString('ar-u-nu-latn',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,19)}
